name: RIS snapshot

on:
  schedule:
    - cron: "20 * * * *"   # GitHub cron is always UTC: :20 UTC = :50 IST, hourly (RIS files land a few minutes after each interval)
  workflow_dispatch:
    inputs:
      fresh:
        description: "Ignore saved state and start from the latest bview"
        type: boolean
        default: false

concurrency:
  group: ris-snapshot      # never two runs writing state at once
  cancel-in-progress: false

permissions:
  contents: write          # releases + commit latest/
  actions: write           # prune old caches

env:
  TZ: Asia/Kolkata        # every time shown in logs, tags and messages is IST
  RETENTION_DAYS: 7        # timestamped snapshot releases older than this are deleted
  KEEP_CACHES: 3

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Restore saved RIB state
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ris-state-${{ github.run_id }}
          restore-keys: ris-state-

      - name: Build snapshot
        id: build
        run: |
          python -m pipeline.ris.build_snapshot --state-dir state | tee snapshots.txt
          echo "dirs=$(tr '\n' ' ' < snapshots.txt)" >> "$GITHUB_OUTPUT"

      - name: Save RIB state
        uses: actions/cache/save@v4
        with:
          path: state
          key: ris-state-${{ github.run_id }}

      - name: Package and summarise
        id: pkg
        run: |
          python -m pipeline.ris.publish ${{ steps.build.outputs.dirs }} --dist dist --latest latest | tee publish.log
          as_of=$(grep '^as_of=' publish.log | cut -d= -f2)
          bview=$(grep '^bview_time=' publish.log | cut -d= -f2)
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "bview_stamp=$(date -d "$bview" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "tag=snapshot-$(date -d "$as_of" +%Y%m%d-%H%M)-IST" >> "$GITHUB_OUTPUT"
          echo "as_of_text=$(date -d "$as_of" '+%Y-%m-%d %H:%M IST')" >> "$GITHUB_OUTPUT"

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          AS_OF: ${{ steps.pkg.outputs.as_of_text }}
          BVIEW_STAMP: ${{ steps.pkg.outputs.bview_stamp }}
        run: |
          notes="RIS routing snapshot as of ${AS_OF}. See manifest.json for sources and checksums."
          # Timestamped release: only the first snapshot after each new bview (3 a day), so 7 days of
          # history stay small. "latest" below is still updated every hour.
          newest=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep '^snapshot-' \
                   | sed -e 's/^snapshot-//' -e 's/-IST$//' | sort | tail -n 1)
          if [[ -z "$newest" || "$newest" < "$BVIEW_STAMP" ]]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" dist/* --title "$TAG" --notes "$notes" --latest=false
            fi
          else
            echo "snapshot-$newest already covers the bview of $BVIEW_STAMP IST; only updating latest"
          fi
          # Rolling "latest" release, overwritten every run
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "latest" --notes "$notes" --latest
          fi
          gh release edit latest --notes "$notes"
          gh release upload latest dist/* --clobber
          # Remove assets of sources no longer published (manifest.json is the list)
          for asset in $(gh release view latest --json assets --jq '.assets[].name'); do
            [[ -e "dist/$asset" ]] || { echo "removing $asset from latest"; gh release delete-asset latest "$asset" --yes; }
          done

      - name: Commit latest/ metadata
        env:
          AS_OF: ${{ steps.pkg.outputs.as_of_text }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # latest/ is fully rewritten each run, so put it on top of the newest main: a run queued
          # behind another one (or behind a push) would otherwise be rejected as out of date.
          cp -a latest "$RUNNER_TEMP/latest"
          git fetch -q origin main && git reset -q --hard origin/main
          rm -rf latest && cp -a "$RUNNER_TEMP/latest" latest
          git add -A latest
          if ! git diff --cached --quiet; then
            git commit -m "snapshot ${AS_OF}"
            git push origin HEAD:main
          fi

      - name: Prune old releases and caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags are snapshot-YYYYMMDD-HHMM-IST (older ones without -IST were UTC); compare the date-time part.
          cutoff=$(date -d "-${RETENTION_DAYS} days" +%Y%m%d-%H%M)
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep '^snapshot-' | while read -r tag; do
            stamp=${tag#snapshot-}; stamp=${stamp%-IST}
            if [[ "$stamp" < "$cutoff" ]]; then
              echo "deleting $tag"; gh release delete "$tag" --cleanup-tag --yes
            fi
          done
          gh cache list --key ris-state- --sort created_at --order desc --limit 100 --json id --jq '.[].id' \
            | tail -n +$((KEEP_CACHES + 1)) | xargs -r -n1 gh cache delete

      - name: Upload run artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            dist/manifest.json
            dist/*_meta.json
          retention-days: 7
          if-no-files-found: ignore
