# RIS pipeline configuration.
# Phase 1: one collector, one peer. Add more [[sources]] entries to scale up.

[ris]
base_url = "https://data.ris.ripe.net"
raw_dir = "data/raw"
output_dir = "output"

[full_feed]
# A peer counts as full-feed if it meets either threshold.
min_ipv4_prefixes = 800000
min_ipv6_prefixes = 150000

[[sources]]
collector = "rrc00"
peer_asn = 7018            # AT&T
# AT&T uses separate sessions per address family.
peer_ips = ["12.0.1.63", "2001:1890:111d:1::63"]
