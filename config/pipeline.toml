# RIS pipeline configuration.
# One [[sources]] entry per (collector, peer AS), listing all of that AS's sessions there.
# Sources on the same collector share one read of each bview and update file, so an extra
# peer on an existing collector is cheap; a new collector adds a whole bview (~400 MB) per fresh run.
# Collectors are RIPE RIS unless [collectors.<name>] says archive = "routeviews".
# Session IPs and prefix counts: python -m pipeline.ris.list_peers <collector>
# display_name (short peer name), the collector location and an optional note (one plain-text
# sentence of context) are copied into meta.json and manifest.json for display; a new source
# should bring its own display_name.

[ris]
base_url = "https://data.ris.ripe.net"
raw_dir = "data/raw"
output_dir = "output"

[routeviews]
base_url = "https://archive.routeviews.org"

[full_feed]
# A peer counts as full-feed if it meets either threshold.
min_ipv4_prefixes = 800000
min_ipv6_prefixes = 150000

# Where each RIS collector is (shown by the portal): city, then the exchange point it sits at,
# or "multihop" for collectors that peers reach over the Internet from anywhere (RIPEstat rrc-info).
[collectors.rrc00]
location = "Amsterdam (multihop)"

[collectors.rrc01]
location = "London (LINX / LONAP)"

[collectors.rrc03]
location = "Amsterdam (AMS-IX / NL-IX)"

[collectors.rrc06]
location = "Tokyo (DIX-IE / JPIX)"

[collectors.rrc23]
location = "Singapore (Equinix)"

[collectors.rrc25]
location = "Amsterdam (multihop)"

[collectors.rrc26]
location = "Dubai (UAE-IX)"

# RouteViews (University of Oregon): RIBs every 2 hours (only 00, 08 and 16 UTC are used, like RIS bviews)
# and 15-minute update files, bzip2.
[collectors."route-views.eqix"]
archive = "routeviews"
location = "Ashburn (Equinix)"

[collectors."route-views.napafrica"]
archive = "routeviews"
location = "Johannesburg (NAPAfrica)"

[collectors."route-views8"]
archive = "routeviews"
location = "Eugene, Oregon (multihop)"

